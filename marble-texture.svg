<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F5F0"/>
      <stop offset="45%" stop-color="#EFEAE1"/>
      <stop offset="100%" stop-color="#E8E0D2"/>
    </linearGradient>
    <linearGradient id="goldVein" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DAAF37" stop-opacity="0"/>
      <stop offset="45%" stop-color="#DAAF37" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#F3D77C" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#DAAF37" stop-opacity="0"/>
