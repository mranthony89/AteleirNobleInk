    <path d="M-30 610 C 150 560, 320 690, 470 610 S 740 540, 860 630" stroke="url(#goldVein)" stroke-width="3"/>

    <path d="M120 -30 C 160 160, 60 280, 150 460 S 70 700, 170 840" stroke="url(#goldVein)" stroke-width="2" transform="rotate(6 400 400)"/>
    <path d="M640 -40 C 690 150, 590 280, 680 460 S 600 700, 700 840" stroke="url(#goldVein)" stroke-width="1.6" transform="rotate(-4 400 400)"/>

    <path d="M-20 250 C 200 210, 280 330, 480 270 S 720 220, 850 300" stroke="#5A5A5A" stroke-opacity="0.10" stroke-width="1"/>
    <path d="M-30 500 C 170 460, 330 560, 480 500 S 700 440, 850 520" stroke="#5A5A5A" stroke-opacity="0.08" stroke-width="1"/>
  </g>
</svg>
